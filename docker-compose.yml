services:
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6380
    depends_on:
      - redis